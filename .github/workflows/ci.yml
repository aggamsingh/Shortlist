name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The embedding model is ~80MB and is fetched on first use. Caching it
      # keeps CI runs to seconds instead of re-downloading on every push.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No Qdrant service container: the suite runs Qdrant embedded, so the
      # end-to-end tests need no external infrastructure.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run retrieval evaluation
        run: python -m evaluation.run_eval --ablations
