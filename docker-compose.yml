version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: resume-screener-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-screener-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ${CV_FOLDER_PATH:-./cvs}:/app/cvs
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-screener-indexer
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ${CV_FOLDER_PATH:-./cvs}:/app/cvs
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    entrypoint: ["python", "indexer/run.py"]

volumes:
  qdrant_data:
