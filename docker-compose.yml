services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: resume-screener-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # No healthcheck here on purpose. The previous one ran
    # `curl -f http://localhost:6333/health`, which is doubly unsafe: Qdrant
    # serves /healthz (not /health), and the official image is not guaranteed to
    # ship curl. Because `app` gated on `condition: service_healthy`, a failing
    # probe meant the API never started at all.
    #
    # Readiness is handled application-side instead, by connect_qdrant() in
    # indexer/utils.py, which retries with backoff and verifies a real round
    # trip. That also covers a Qdrant restart while the API is already up --
    # something a startup-only healthcheck never catches.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-screener-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ${CV_FOLDER_PATH:-./cvs}:/app/cvs
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      # The API image installs curl, so this probe is safe here.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-screener-indexer
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ${CV_FOLDER_PATH:-./cvs}:/app/cvs
      - ./data:/app/data
    depends_on:
      - qdrant
    # Run as a module so /app is on sys.path. `python indexer/run.py` puts
    # /app/indexer on sys.path instead, and `from indexer.utils import ...`
    # then fails with ModuleNotFoundError.
    entrypoint: ["python", "-m", "indexer.run"]

volumes:
  qdrant_data:
